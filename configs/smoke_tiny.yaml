seed: 42
sample_rate: 8000
segment_seconds: 1.0
batch_size: 2
num_workers: 0
max_epochs: 1
device: cpu

data:
  normalize_audio: true
  curriculum: false

model:
  name: cafe_tse
  n_fft: 128
  hop_length: 32
  win_length: 128
  emb_dim: 8
  hidden_dim: 16
  n_blocks: 2
  n_heads: 1
  sparse_fusion_blocks: [0]
  dynamic_inference: true
  shallow_blocks: 1
  lite_blocks: 1
  full_blocks: 2
  route_threshold_easy: 0.35
  route_threshold_hard: 0.65

loss:
  si_sdr_weight: 1.0
  spectral_weight: 0.05

optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 5.0

eval:
  save_audio: 2
  compute_sdr_sir_sar: true
  compute_pesq_stoi: false

